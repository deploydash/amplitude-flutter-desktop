name: amplitude_flutter
description: Official Amplitude Flutter SDK, supporting Android, iOS, Linux, Windows, macOS, and web platforms.
version: 4.7.1
homepage: https://www.amplitude.com
repository: https://github.com/amplitude/Amplitude-Flutter


environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.1"
dependencies:
  device_info_plus: ^13.2.0
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  http: ^1.6.0
  package_info_plus: ^10.2.1
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5

dev_dependencies:
  build_runner: ^2.3.3
  flutter_lints: ^2.0.3
  flutter_test:
    sdk: flutter
  lints: ^2.1.1
  mockito: ^5.4.0
  test: ^1.22.0

flutter:
  plugin:
    platforms:
      android:
        package: com.amplitude.amplitude_flutter
        pluginClass: AmplitudeFlutterPlugin
      ios:
        pluginClass: AmplitudeFlutterPlugin
        sharedDarwinSource: true
      linux:
        dartPluginClass: DesktopAmplitudePlugin
        dartFileName: desktop/desktop_plugin.dart
      macos:
        pluginClass: AmplitudeFlutterPlugin
        sharedDarwinSource: true
      windows:
        dartPluginClass: DesktopAmplitudePlugin
        dartFileName: desktop/desktop_plugin.dart
      web:
        pluginClass: AmplitudeFlutterPlugin
        fileName: amplitude_web.dart
